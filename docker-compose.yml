version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abundance
      POSTGRES_PASSWORD: abundance_secure_pass
      POSTGRES_DB: abundance_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abundance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://abundance:abundance_secure_pass@db:5432/abundance_crm
      ENV: production
      DEBUG: "False"
      SECRET_KEY: your-secret-key-here
      ALLOWED_ORIGINS: "http://localhost:3000,https://yourdomain.digitalocean.app"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
